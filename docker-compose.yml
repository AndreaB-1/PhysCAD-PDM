# PLM Lite: paste into Portainer → Stacks → Add stack (or `docker compose up -d`).
# Set the variables in Portainer's "Environment variables" section or in a .env file next to this one.
name: plm-lite

services:
  app:
    image: ${PLM_IMAGE:-ghcr.io/andreab-1/physcad-pdm:latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${PLM_PORT:-8080}:8080"
    environment: &env
      ROLE: app
      APP_URL: ${APP_URL:-}
      PUBLIC_SHARE_URL: ${PUBLIC_SHARE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DB_HOST: db
      DB_NAME: plm
      DB_USER: plm
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      TZ: ${TZ:-UTC}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
    volumes:
      - ${VAULTS_PATH:?set VAULTS_PATH to the NAS folder that holds the vaults}:/vaults
      - app-data:/data

  worker:
    image: ${PLM_IMAGE:-ghcr.io/andreab-1/physcad-pdm:latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      app: { condition: service_started }
    environment:
      <<: *env
      ROLE: worker
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ${VAULTS_PATH}:/vaults
      - app-data:/data
    healthcheck: { disable: true }

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plm
      POSTGRES_USER: plm
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data   # keep on the Docker host's local disk, never on SMB/NFS
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plm -d plm"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  app-data:
